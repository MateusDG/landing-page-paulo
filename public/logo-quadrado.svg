<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="logo-square-title logo-square-desc">
  <title id="logo-square-title">Valdecir Francisco — Compra e venda de imóveis</title>
  <desc id="logo-square-desc">Símbolo de curvas de nível formando um vale e as iniciais VF.</desc>

  <rect width="1200" height="1200" fill="#24342d"/>

  <!-- Sol e relevo: uma leitura territorial, sem desenho literal de casa. -->
  <circle cx="890" cy="214" r="54" fill="#c57b4c"/>
  <path d="M146 532c142-218 300-322 470-310 111 8 211 56 301 143" fill="none" stroke="#f4eadb" stroke-width="24" stroke-linecap="round" opacity=".92"/>
  <path d="M104 633c154-214 316-312 485-291 112 14 212 66 306 158" fill="none" stroke="#c57b4c" stroke-width="28" stroke-linecap="round"/>

  <!-- VF desenhado como um caminho entre duas curvas do terreno. -->
  <path d="M207 394 380 752 553 394" fill="none" stroke="#f4eadb" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M626 394h350M626 394v358M626 570h272" fill="none" stroke="#c57b4c" stroke-width="66" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Base cartográfica, com transparência para manter o símbolo leve. -->
  <path d="M106 825c165-125 331-162 498-111 145 44 310 27 490-72" fill="none" stroke="#f4eadb" stroke-width="22" stroke-linecap="round" opacity=".74"/>
  <path d="M106 930c157-102 317-131 481-83 156 45 319 29 507-65" fill="none" stroke="#f4eadb" stroke-width="13" stroke-linecap="round" opacity=".42"/>

  <line x1="220" y1="1010" x2="980" y2="1010" stroke="#c57b4c" stroke-width="9"/>
  <text x="600" y="1082" text-anchor="middle" fill="#f4eadb" font-family="Georgia, 'Times New Roman', serif" font-size="66" font-weight="700" letter-spacing="11">VALDECIR</text>
  <text x="600" y="1130" text-anchor="middle" fill="#f4eadb" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600" letter-spacing="7">COMPRA E VENDA DE IMÓVEIS</text>
</svg>
