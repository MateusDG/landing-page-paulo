name: Publicar na Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publicar-hostinger
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.18.0
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Auditar dependencias
        run: npm audit --audit-level=high && npm audit signatures

      - name: Validar o projeto
        run: npm run check

      - name: Gerar o site estatico
        env:
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://valdecimoveis.com.br' }}
          PUBLIC_WHATSAPP: ${{ vars.PUBLIC_WHATSAPP || '5527999309535' }}
          PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}
          PUBLIC_GOOGLE_BUSINESS_URL: ${{ vars.PUBLIC_GOOGLE_BUSINESS_URL }}
          PUBLIC_INSTAGRAM_URL: ${{ vars.PUBLIC_INSTAGRAM_URL }}
          PUBLIC_FACEBOOK_URL: ${{ vars.PUBLIC_FACEBOOK_URL }}
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_ID: ${{ vars.PUBLIC_UMAMI_ID }}
          PUBLIC_GTM_ID: ${{ vars.PUBLIC_GTM_ID || 'GTM-P3LBCHF8' }}
          PUBLIC_GOOGLE_ADS_ID: ${{ vars.PUBLIC_GOOGLE_ADS_ID || 'AW-18371455109' }}
        run: npm run build

      - name: Atualizar a branch de publicacao
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          touch .nojekyll
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Publicacao ${GITHUB_SHA}"
          git branch -M hostinger
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" hostinger
